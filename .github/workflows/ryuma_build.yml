name: Build Ryuma Gradient

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework UIKit \
            -framework Foundation \
            RyumaGradient.m \
            -o RyumaGradient.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RyumaGradient
          path: RyumaGradient.dylib
